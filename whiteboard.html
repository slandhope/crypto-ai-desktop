<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="asuka-design.css">
<script>
  (function () {
    try {
      var m = localStorage.getItem('asuka-appearance') === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', m)
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
  })()
</script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--aurora); overflow:hidden; font-family:var(--body); color:var(--ink); }
  #bar {
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    background:var(--glass); border-bottom:0.5px solid var(--glass-border);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    box-shadow:var(--lens); -webkit-app-region:drag; cursor:move;
  }
  #bar .title { font-size:13px; font-weight:600; color:var(--ink); letter-spacing:-0.01em; font-family:var(--display); }
  #bar .close {
    -webkit-app-region:no-drag; cursor:pointer; color:var(--ink-3); font-size:15px;
    width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
    background:var(--glass-soft); border:0.5px solid var(--glass-border);
  }
  #wb-canvas { display:block; width:100%; background:#fbfaf7; }
  html[data-theme="dark"] #wb-canvas { background:#1c1c1e; }
</style>
</head>
<body class="asuka-surface">
  <div id="bar">
    <div class="title">🖊️ Asuka's Whiteboard</div>
    <div class="close" id="wb-close">✕</div>
  </div>
  <canvas id="wb-canvas" width="800" height="460"></canvas>

<script>
  // ipcRenderer global from preload.js
  document.getElementById('wb-close').addEventListener('click', () => ipcRenderer.invoke('close-whiteboard').catch(()=>{}))

  let _busy = false, _queue = []
  function wbClear() {
    const cv = document.getElementById('wb-canvas')
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height)
  }
  async function wbRun(cmds) {
    if (_busy) { _queue.push(cmds); return }
    _busy = true; wbClear()
    const cv = document.getElementById('wb-canvas'), ctx = cv.getContext('2d')
    for (const c of cmds) {
      try {
        ctx.strokeStyle = c.color || '#1a1a2e'
        ctx.fillStyle = c.color || '#1a1a2e'
        ctx.lineWidth = 2.5; ctx.lineCap = 'round'
        if (c.t === 'title') {
          ctx.font = '700 26px system-ui'; ctx.textAlign = 'center'
          for (let i = 1; i <= c.v.length; i++) { ctx.clearRect(0, c.y-28, 800, 36); ctx.fillText(c.v.slice(0,i), c.x, c.y); await sleep(26) }
          ctx.textAlign = 'left'
        } else if (c.t === 'text') {
          ctx.font = (c.size||17) + 'px system-ui'
          for (let i = 1; i <= c.v.length; i++) { ctx.clearRect(c.x-2, c.y-(c.size||17), 800-c.x, (c.size||17)+8); ctx.fillText(c.v.slice(0,i), c.x, c.y); await sleep(18) }
        } else if (c.t === 'line' || c.t === 'arrow') {
          const st = 14
          for (let i = 1; i <= st; i++) { const px = c.x1+(c.x2-c.x1)*i/st, py = c.y1+(c.y2-c.y1)*i/st; ctx.beginPath(); ctx.moveTo(c.x1,c.y1); ctx.lineTo(px,py); ctx.stroke(); await sleep(15) }
          if (c.t === 'arrow') { const a = Math.atan2(c.y2-c.y1, c.x2-c.x1); ctx.beginPath(); ctx.moveTo(c.x2,c.y2); ctx.lineTo(c.x2-11*Math.cos(a-0.45), c.y2-11*Math.sin(a-0.45)); ctx.moveTo(c.x2,c.y2); ctx.lineTo(c.x2-11*Math.cos(a+0.45), c.y2-11*Math.sin(a+0.45)); ctx.stroke() }
        } else if (c.t === 'circle') {
          for (let i = 1; i <= 16; i++) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, -Math.PI/2, -Math.PI/2 + Math.PI*2*i/16); ctx.stroke(); await sleep(18) }
        } else if (c.t === 'box') {
          ctx.strokeRect(c.x, c.y, c.w, c.h); await sleep(140)
        }
        await sleep(210)
      } catch(e) {}
    }
    _busy = false
    if (_queue.length) wbRun(_queue.shift())
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }
  ipcRenderer.on('whiteboard-draw', (e, cmds) => { if (Array.isArray(cmds) && cmds.length) wbRun(cmds) })
</script>
<script>
  try {
    (window.ipcRenderer || window.asuka?.ipc)?.on?.('appearance-changed', function (_e, payload) {
      var m = (payload && payload.mode) === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', m)
      try { localStorage.setItem('asuka-appearance', m) } catch (e) {}
    })
  } catch (e) {}
</script>

</body>
</html>
