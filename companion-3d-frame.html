<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #c3d { width: 100%; height: 100%; display: block; }
  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #a0a0a8; font: 12px -apple-system, sans-serif; padding: 16px; text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="err"></div>
<script type="module">
const err = document.getElementById('err');
const fail = (t) => { err.textContent = t; err.style.display = 'flex'; };

async function exists(url) {
  try {
    const r = await fetch(url, { method: 'HEAD' });
    return r.ok;
  } catch (_) {
    try {
      const r = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' } });
      return r.ok || r.status === 206;
    } catch (e2) { return false; }
  }
}

const animCandidates = [
  'Idle.fbx', 'idle.fbx', 'Sitting.fbx', 'sitting.fbx',
  'Talking.fbx', 'talk.fbx', 'Walk.fbx', 'walk.fbx',
];

try {
  let modelURL = './assets/vrm/nova/model.fbx';
  if (!(await exists(modelURL))) modelURL = './assets/vrm/asuka.glb';
  if (!(await exists(modelURL))) { fail('Missing assets/vrm/nova/model.fbx (or asuka.glb)'); }
  else {
    const anims = [];
    for (const f of animCandidates) {
      const url = './assets/vrm/' + f;
      if (await exists(url)) anims.push({ url, name: f.replace(/\.fbx$/i, '') });
    }
    const { mountCompanion3D } = await import('./companion-3d.js');
    await mountCompanion3D(document.getElementById('c3d'), { modelURL, anims });
  }
} catch (e) {
  fail('Nova: ' + (e && e.message ? e.message : e));
}
</script>
</body></html>
