<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asuka</title>
<link rel="stylesheet" href="asuka-design.css">
<script>
  (function () {
    try {
      var m = localStorage.getItem('asuka-appearance') === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', m)
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
  })()
</script>

<style>
  :root, html[data-theme="light"] {
    --ink-dim: #6e6e73;
    --ink-faint: #86868b;
    --petal: #e89bc4;
    --petal-deep: #d98bb8;
    --iris: #5b6cff;
    --iris-glow: #6d5ef0;
    --gold: #c47d0e;
    --card: rgba(255,255,255,0.42);
    --line: rgba(255,255,255,0.55);
  }
  html[data-theme="dark"] {
    --ink-dim: #a1a1a6;
    --ink-faint: #6e6e73;
    --petal: #f0a8d0;
    --petal-deep: #e89bc4;
    --iris: #8b7cff;
    --iris-glow: #a78bfa;
    --gold: #ffd60a;
    --card: rgba(40, 40, 44, 0.48);
    --line: rgba(255,255,255,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--aurora);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .aurora {
    position: fixed; inset: -20%;
    background:
      radial-gradient(40% 50% at 25% 30%, rgba(160,210,255,0.55), transparent 70%),
      radial-gradient(45% 55% at 78% 65%, rgba(255,180,210,0.40), transparent 70%),
      radial-gradient(35% 40% at 60% 20%, rgba(255,230,180,0.35), transparent 70%);
    filter: blur(28px);
    animation: drift 22s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.08); }
  }

  .petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute; top: -5%;
    width: 12px; height: 12px;
    background: linear-gradient(135deg, var(--petal), var(--petal-deep));
    border-radius: 100% 0 100% 0;
    opacity: 0.55;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    12%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(420deg); opacity: 0; }
  }

  .card {
    position: relative; z-index: 2;
    width: min(90vw, 420px);
    background: var(--glass);
    border: 0.5px solid var(--glass-border);
    border-radius: 28px;
    padding: 44px 40px 36px;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--lens), var(--shadow-float);
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .sigil {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, var(--iris-glow), var(--iris) 45%, var(--petal-deep) 100%);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.65), 0 12px 40px -8px rgba(139,124,255,0.35);
    position: relative;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.65), 0 12px 40px -8px rgba(139,124,255,0.32); }
    50%     { box-shadow: 0 0 0 1px rgba(255,255,255,0.85), 0 14px 52px -6px rgba(232,155,196,0.45); }
  }
  .sigil span {
    font-family: var(--display);
    font-size: 40px; font-weight: 700; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
    line-height: 1;
  }

  .name-jp {
    font-family: var(--display);
    font-size: 13px; letter-spacing: 6px;
    color: var(--petal-deep); margin-bottom: 4px; font-weight: 500;
    padding-left: 6px;
  }
  h1 {
    font-family: var(--display);
    font-size: 30px; font-weight: 600; letter-spacing: -0.03em;
    margin-bottom: 10px; color: var(--ink);
  }
  .tagline {
    font-size: 14px; color: var(--ink-dim); line-height: 1.55;
    margin-bottom: 30px;
  }

  .signin-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px 20px;
    background: var(--glass-strong);
    color: var(--ink);
    border: 0.5px solid var(--glass-border); border-radius: 999px;
    font-family: var(--body);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: var(--lens), var(--shadow-1);
  }
  .signin-btn:hover { transform: scale(1.02); box-shadow: var(--lens), var(--shadow-2); }
  .signin-btn:active { transform: scale(0.98); }
  .signin-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .status {
    margin-top: 18px; min-height: 20px;
    font-size: 12.5px; color: var(--ink-faint);
    transition: color 0.2s;
  }
  .status.working { color: var(--iris); }
  .status.error { color: #be123c; }

  .waiting-dots::after {
    content: ''; animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }

  .footnote {
    margin-top: 26px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-faint); line-height: 1.6;
  }
  .footnote b { color: var(--ink-dim); font-weight: 500; }

  .drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; -webkit-app-region: drag; z-index: 5; }
</style>
</head>
<body>
  <div class="drag"></div>
  <div class="aurora"></div>
  <div class="petals" id="petals"></div>

  <div class="card">
    <div class="sigil"><span>明</span></div>
    <div class="name-jp">アスカ</div>
    <h1>Welcome to Asuka</h1>
    <p class="tagline">Your companion, tutor, and trading partner —<br>waiting to pick up right where you left off.</p>

    <button class="signin-btn" id="signin">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
      Continue with Google
    </button>

    <div class="status" id="status">One account. Same Asuka on every device.</div>

    <div class="footnote">
      Asuka is an <b>AI companion</b> (not a human therapist or financial advisor). Signing in restores her memory across <b>desktop and phone</b>. 18+ only.
    </div>
  </div>

<script>
  const api = window.electronAPI;

  // scatter petals
  const petalWrap = document.getElementById('petals');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    const s = 8 + Math.random() * 8;
    p.style.width = s + 'px'; p.style.height = s + 'px';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    petalWrap.appendChild(p);
  }

  const btn = document.getElementById('signin');
  const status = document.getElementById('status');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.style.opacity = '0.7';
    status.className = 'status working';
    status.innerHTML = '<span class="waiting-dots">Opening Google sign-in</span>';
    try {
      const result = await api.googleLogin();
      if (result && result.ok) {
        status.className = 'status working';
        status.textContent = 'Welcome back' + (result.name ? ', ' + result.name : '') + ' — waking Asuka…';
      } else {
        throw new Error(result && result.error ? result.error : 'Sign-in was cancelled');
      }
    } catch (e) {
      status.className = 'status error';
      status.textContent = e.message || 'Could not sign in. Try again.';
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  });

  api.onAuthSuccess(() => {
    status.className = 'status working';
    status.textContent = 'Welcome back — waking Asuka…';
  });
</script>
<script>
  try {
    (window.ipcRenderer || window.asuka?.ipc)?.on?.('appearance-changed', function (_e, payload) {
      var m = (payload && payload.mode) === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', m)
      try { localStorage.setItem('asuka-appearance', m) } catch (e) {}
    })
  } catch (e) {}
</script>

</body>
</html>
