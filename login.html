<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asuka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --ink: #f3eefc;
    --ink-dim: #a99fc4;
    --ink-faint: #6b6388;
    --bg-0: #0a0710;
    --bg-1: #120c1e;
    --petal: #ff8fb1;
    --petal-deep: #e0567f;
    --iris: #9b7cff;
    --iris-glow: #b79bff;
    --gold: #ffd98a;
    --card: rgba(28, 20, 44, 0.72);
    --line: rgba(155, 124, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-0);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ambient aurora behind everything */
  .aurora {
    position: fixed; inset: -20%;
    background:
      radial-gradient(40% 50% at 25% 30%, rgba(155,124,255,0.22), transparent 70%),
      radial-gradient(45% 55% at 78% 65%, rgba(224,86,127,0.18), transparent 70%),
      radial-gradient(35% 40% at 60% 20%, rgba(255,217,138,0.08), transparent 70%);
    filter: blur(20px);
    animation: drift 22s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.08); }
  }

  /* falling petals */
  .petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute; top: -5%;
    width: 12px; height: 12px;
    background: linear-gradient(135deg, var(--petal), var(--petal-deep));
    border-radius: 100% 0 100% 0;
    opacity: 0.55;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    12%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(420deg); opacity: 0; }
  }

  /* the card */
  .card {
    position: relative; z-index: 2;
    width: min(90vw, 420px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 44px 40px 36px;
    backdrop-filter: blur(24px) saturate(140%);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* her sigil / avatar mark */
  .sigil {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, var(--iris-glow), var(--iris) 45%, var(--petal-deep) 100%);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 12px 40px -8px rgba(155,124,255,0.6);
    position: relative;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 12px 40px -8px rgba(155,124,255,0.55); }
    50%     { box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 14px 52px -6px rgba(255,143,177,0.6); }
  }
  .sigil span {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 40px; font-weight: 700; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    line-height: 1;
  }

  .name-jp {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px; letter-spacing: 6px;
    color: var(--petal); margin-bottom: 4px; font-weight: 500;
    padding-left: 6px;
  }
  h1 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .tagline {
    font-size: 14px; color: var(--ink-dim); line-height: 1.55;
    margin-bottom: 30px;
  }

  .signin-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px 20px;
    background: #fff;
    color: #1a1523;
    border: none; border-radius: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.5);
  }
  .signin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -8px rgba(155,124,255,0.4); }
  .signin-btn:active { transform: translateY(0); }
  .signin-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .status {
    margin-top: 18px; min-height: 20px;
    font-size: 12.5px; color: var(--ink-faint);
    transition: color 0.2s;
  }
  .status.working { color: var(--iris-glow); }
  .status.error { color: var(--petal); }

  .waiting-dots::after {
    content: ''; animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }

  .footnote {
    margin-top: 26px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-faint); line-height: 1.6;
  }
  .footnote b { color: var(--ink-dim); font-weight: 500; }

  /* drag region for frameless window */
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; -webkit-app-region: drag; z-index: 5; }
</style>
</head>
<body>
  <div class="drag"></div>
  <div class="aurora"></div>
  <div class="petals" id="petals"></div>

  <div class="card">
    <div class="sigil"><span>明</span></div>
    <div class="name-jp">アスカ</div>
    <h1>Welcome to Asuka</h1>
    <p class="tagline">Your companion, tutor, and trading partner —<br>waiting to pick up right where you left off.</p>

    <button class="signin-btn" id="signin">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
      Continue with Google
    </button>

    <div class="status" id="status">One account. Same Asuka on every device.</div>

    <div class="footnote">
      Signing in creates or restores your Asuka — her memory, bond, and progress live with your account, so she follows you from <b>desktop to phone</b>.
    </div>
  </div>

<script>
  const { ipcRenderer } = require('electron');

  // scatter petals
  const petalWrap = document.getElementById('petals');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    const s = 8 + Math.random() * 8;
    p.style.width = s + 'px'; p.style.height = s + 'px';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    petalWrap.appendChild(p);
  }

  const btn = document.getElementById('signin');
  const status = document.getElementById('status');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.style.opacity = '0.7';
    status.className = 'status working';
    status.innerHTML = '<span class="waiting-dots">Opening Google sign-in</span>';
    try {
      const result = await ipcRenderer.invoke('auth-google-login');
      if (result && result.ok) {
        status.className = 'status working';
        status.textContent = 'Welcome back' + (result.name ? ', ' + result.name : '') + ' — waking Asuka…';
        // main process will close this window and open the app
      } else {
        throw new Error(result && result.error ? result.error : 'Sign-in was cancelled');
      }
    } catch (e) {
      status.className = 'status error';
      status.textContent = e.message || 'Could not sign in. Try again.';
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  });

  // if main tells us login finished (e.g. via deep link), react
  ipcRenderer.on('auth-success', (_e, user) => {
    status.className = 'status working';
    status.textContent = 'Welcome back — waking Asuka…';
  });
</script>
</body>
</html>
