    // ═══ PIXEL PET — double-tap Asuka → little pixel buddy ═══
    // Loads sliced animation strips from ./pixel/<character>/<state>.png
    // Each strip = frames side-by-side, same height. Falls back to a
    // code-drawn placeholder if art isn't present yet.
    function initPixelPet() {
      const petCanvas = document.getElementById('pixel-pet')
      const petBubble = document.getElementById('pixel-bubble')
      if (!petCanvas) return
      const pctx = petCanvas.getContext('2d')
      pctx.imageSmoothingEnabled = false
      const CV = 128            // canvas internal resolution (matches 128px art)
      const PAD = 8             // padding inside the canvas

      let pixelMode = false, frame = 0, dir = 1, posX = 20, posY = 0, vy = 0, state = 'idle', stateTimer = 0, animTimer = null
      let _petDragging=false, _petDragged=false, _pdx=0, _pdy=0
      let targetX = null, climbSide='left'
      // which character — saved between sessions
      let character = localStorage.getItem('pixelChar') || 'huohuo'

      // states we load + how many frames each strip has (for timing; actual count read from image)
      const STATES = ['idle','walk','happy','celebrate','dance','sad','sleep','think','exercise','held','sing','sit','climb','read','stretch','yawn','petcat']
      const strips = {}   // strips[char][state] = { img, frames, ready }

      function loadStrip(char, st) {
        if (!strips[char]) strips[char] = {}
        if (strips[char][st]) return
        const img = new Image()
        const rec = { img, frames: 1, ready: false }
        img.onload = () => { rec.frames = Math.max(1, Math.round(img.width / img.height)); rec.ready = true }
        img.onerror = () => { rec.ready = false }
        try { img.src = `./pixel/${char}/${st}.png` } catch(e) {}
        strips[char][st] = rec
      }
      function loadCharacter(char) { STATES.forEach(st => loadStrip(char, st)) }
      loadCharacter('huohuo'); loadCharacter('catgirl')

      // map behavior-state → an available art state (fallbacks)
      function artState(st) {
        const c = strips[character] || {}
        if (st === 'climb' || st === 'hang') { if (c.climb?.ready) return 'climb'; if (c.exercise?.ready) return 'exercise'; if (c.walk?.ready) return 'walk' }
        if (st === 'drop') { if (c.sad?.ready) return 'sad'; if (c.idle?.ready) return 'idle' }
        if (st === 'sit') { if (c.sit?.ready) return 'sit'; if (c.sleep?.ready) return 'sleep'; if (c.idle?.ready) return 'idle' }
        if (st === 'sing') { if (c.sing?.ready) return 'sing'; if (c.happy?.ready) return 'happy'; if (c.idle?.ready) return 'idle' }
        if (st === 'tilt') { if (c.think?.ready) return 'think'; if (c.idle?.ready) return 'idle' }
        if (st === 'read') { if (c.read?.ready) return 'read'; if (c.sit?.ready) return 'sit'; if (c.idle?.ready) return 'idle' }
        if (st === 'stretch') { if (c.stretch?.ready) return 'stretch'; if (c.exercise?.ready) return 'exercise'; if (c.idle?.ready) return 'idle' }
        if (st === 'yawn') { if (c.yawn?.ready) return 'yawn'; if (c.sleep?.ready) return 'sleep'; if (c.idle?.ready) return 'idle' }
        if (st === 'petcat') { if (c.petcat?.ready) return 'petcat'; if (c.happy?.ready) return 'happy'; if (c.idle?.ready) return 'idle' }
        if (c[st] && c[st].ready) return st
        if (st === 'celebrate' && c.happy?.ready) return 'happy'
        if (st === 'sleep' && c.idle?.ready) return 'idle'
        if (st === 'think' && c.idle?.ready) return 'idle'
        if (st === 'exercise' && c.dance?.ready) return 'dance'
        if (c.idle?.ready) return 'idle'
        return null
      }

      function drawPlaceholder(f, st) {
        pctx.clearRect(0,0,CV,CV)
        const bob = st==='sleep'?0:Math.sin(f*0.8)*2, cx=CV/2, cy=CV*0.6+bob
        pctx.fillStyle='#3a4668'; pctx.fillRect(cx-9,cy-2,18,18)
        pctx.fillStyle='#ffe0c0'; pctx.fillRect(cx-10,cy-20,20,18)
        pctx.fillStyle='#7bc47f'; pctx.fillRect(cx-12,cy-24,24,10); pctx.fillRect(cx-12,cy-24,5,22); pctx.fillRect(cx+7,cy-24,5,22)
        pctx.fillStyle='#222'
        if(st==='sleep'){pctx.fillRect(cx-6,cy-11,4,1);pctx.fillRect(cx+2,cy-11,4,1)}else{pctx.fillRect(cx-6,cy-12,3,3);pctx.fillRect(cx+3,cy-12,3,3)}
        pctx.fillStyle='#2a3350'; const step=st==='walk'?(f%2===0?2:-2):0
        pctx.fillRect(cx-7,cy+16,5,5+step); pctx.fillRect(cx+2,cy+16,5,5-step)
        if(st==='sleep'){pctx.fillStyle='#9fe';pctx.font='10px monospace';pctx.fillText('z',cx+12,cy-18)}
      }

      function render() {
        // held → show a wobbling dangle (use 'sad'/'shocked'-ish frames + a tilt)
        if (_petDragging) {
          const c = strips[character] || {}
          const rec2 = (c.held && c.held.ready) ? c.held : (c.sad && c.sad.ready ? c.sad : (c.idle && c.idle.ready ? c.idle : null))
          pctx.clearRect(0,0,CV,CV)
          _wobble += 0.3
          const tilt = Math.sin(_wobble) * 0.14   // gentle swing while dangling
          pctx.save(); pctx.translate(CV/2,CV/2); pctx.rotate(tilt); pctx.translate(-CV/2,-CV/2)
          if (rec2 && rec2.ready) { const fw=rec2.img.height, col=frame%rec2.frames; pctx.drawImage(rec2.img, col*fw,0,fw,rec2.img.height, 12,8,CV-24,CV-16) }
          else { drawPlaceholder(frame, 'idle') }
          pctx.restore()
          return
        }
        const as = artState(state)
        const rec = as && strips[character] ? strips[character][as] : null
        if (rec && rec.ready) {
          pctx.clearRect(0,0,CV,CV)
          const fw = rec.img.height                     // square frames
          const col = frame % rec.frames
          pctx.save()
          if (state === 'tilt') { const t=Math.sin(frame*0.25)*0.22; pctx.translate(CV/2,CV/2); pctx.rotate(t); pctx.translate(-CV/2,-CV/2) } // head tilt wobble
          if (dir < 0) { pctx.translate(64,0); pctx.scale(-1,1) }
          pctx.drawImage(rec.img, col*fw, 0, fw, rec.img.height, 12, 8, CV-24, CV-16)
          pctx.restore()
        } else {
          drawPlaceholder(frame, state)
        }
      }

      function setState(s){ state=s; stateTimer=0; if(s==='walk'&&Math.random()<0.5)dir*=-1; if(s==='sing')showBubble('♪ la la~ 🎵',2500); if(s==='sit')showBubble('*sits* 😌',2000)
        if(s==='read')showBubble('reading… 📖',2500); if(s==='stretch')showBubble('mmf~ stretch! ✨',2000)
        if(s==='yawn')showBubble('*yawn* 😴',2000); if(s==='petcat')showBubble('kitty! 🐱💕',2500) }
      // floating musical notes while singing
      function spawnNote(){
        if(!pixelMode)return
        const n=document.createElement('div'); n.textContent=['♪','♫','🎵','♩'][Math.floor(Math.random()*4)]
        n.style.cssText='position:fixed;z-index:10001;font-size:18px;color:#9fe;pointer-events:none;transition:all 1.6s ease-out;left:'+(posX+50+Math.random()*20)+'px;top:'+(posY+10)+'px;opacity:1;'
        document.body.appendChild(n)
        requestAnimationFrame(()=>{ n.style.top=(posY-60)+'px'; n.style.opacity='0' })
        setTimeout(()=>n.remove(),1600)
      }
      function tick(){
        frame++; stateTimer++
        if(_petDragging){ render(); return }  // held → render() shows the dangle wobble
        const floorY = window.innerHeight - 150
        const maxX = Math.max(20, window.innerWidth - 130)
        if(state==='walk'){
          posX += dir*4
          if(posX<8){ posX=8; if(Math.random()<0.5){ setState('climb'); climbSide='left' } else dir=1 }
          if(posX>maxX){ posX=maxX; if(Math.random()<0.5){ setState('climb'); climbSide='right' } else dir=-1 }
          if(stateTimer%3===0 && Math.random()<0.25) posY += (Math.random()<0.5?-1:1)*20
          posY = Math.max(20, Math.min(floorY, posY))
          if(stateTimer>30&&Math.random()<0.05){
            const acts=['idle','sleep','dance','exercise','sit','sing','tilt','read','stretch','yawn','petcat']
            setState(acts[Math.floor(Math.random()*acts.length)])
          }
        }
        else if(state==='sit'){ if(stateTimer>50&&Math.random()<0.05)setState('walk') }
        else if(state==='sing'){
          if(stateTimer%6===0) spawnNote()
          if(stateTimer>55&&Math.random()<0.05)setState('walk')
        }
        else if(state==='tilt'){ if(stateTimer>30&&Math.random()<0.07)setState('walk') }
        else if(state==='read'){ if(stateTimer>80&&Math.random()<0.04)setState('walk') }
        else if(state==='stretch'){ if(stateTimer>30&&Math.random()<0.07)setState('walk') }
        else if(state==='yawn'){ if(stateTimer>25&&Math.random()<0.08)setState('sleep') }
        else if(state==='petcat'){ if(stateTimer>70&&Math.random()<0.04)setState('walk') }
        else if(state==='climb'){
          // climb UP the wall she hit
          posX = climbSide==='left' ? 4 : maxX
          posY -= 4
          if(posY <= 24){ posY=24; setState('hang'); showBubble(['wheee~','up here! 🙌','peekaboo','😼'][Math.floor(Math.random()*4)],2200) }
          petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'; render(); return
        }
        else if(state==='hang'){
          // hang at the top a bit, then slide/drop back down
          posX = climbSide==='left' ? 4 : maxX
          if(stateTimer>40 && Math.random()<0.06){ setState('drop') }
          petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'; render(); return
        }
        else if(state==='drop'){
          // fall back to the floor, then resume roaming
          posY += 12
          if(posY>=floorY){ posY=floorY; dir = climbSide==='left'?1:-1; setState('walk') }
          petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'; render(); return
        }
        else if(state==='idle'){ if(stateTimer>25&&Math.random()<0.06)setState('walk') }
        else if(state==='sleep'){ if(stateTimer>70&&Math.random()<0.04)setState('walk') }
        else if(state==='dance'||state==='exercise'){ if(stateTimer>45&&Math.random()<0.04)setState('walk') }
        else if(state==='happy'||state==='celebrate'){ if(stateTimer>20)setState('walk') }
        else if(state==='think'){ if(stateTimer>30)setState('walk') }
        petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'
        render()
      }
      function showBubble(t,ms){ if(!pixelMode)return; petBubble.textContent=t; petBubble.style.left=posX+'px'; petBubble.style.display='block'; clearTimeout(petBubble._t); petBubble._t=setTimeout(()=>petBubble.style.display='none',ms||2500) }

      function enterPixel(){
        pixelMode=true
        const cv=document.getElementById('canvas'); if(cv){ cv.style.opacity='0'; cv.style.pointerEvents='none' }
        document.querySelectorAll('.btn').forEach(b=>b.style.display='none')
        document.body.style.background='transparent'
        // free-roam: position absolutely anywhere on the fullscreen overlay
        petCanvas.style.position='fixed'; petCanvas.style.display='block'
        posX = Math.min(window.innerWidth-130, 80); posY = window.innerHeight - 150
        petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'; petCanvas.style.bottom='auto'
        setState('walk')
        if(animTimer)clearInterval(animTimer); animTimer=setInterval(tick,90)
        renderCharSwitch()
        showBubble('hi! 🌸',2000)
        try{ipcRenderer.send('pixel-mode',true)}catch(e){}
      }
      function exitPixel(){
        pixelMode=false
        if(animTimer){clearInterval(animTimer);animTimer=null}
        petCanvas.style.display='none'; petBubble.style.display='none'
        const sw=document.getElementById('pixel-switch'); if(sw)sw.style.display='none'
        const cv=document.getElementById('canvas'); if(cv){ cv.style.opacity='1'; cv.style.pointerEvents='' }
        document.querySelectorAll('.btn').forEach(b=>b.style.display='')
        document.body.style.background=''
        petCanvas.style.bottom='20px'; petCanvas.style.top='auto'
        try{ipcRenderer.send('pixel-mode',false)}catch(e){}
      }

      // tiny character-switch button shown in pixel mode
      function renderCharSwitch(){
        let sw=document.getElementById('pixel-switch')
        if(!sw){ sw=document.createElement('div'); sw.id='pixel-switch'
          sw.style.cssText='position:fixed;bottom:20px;right:20px;z-index:10001;background:rgba(20,18,30,.9);color:#fff;font-size:11px;font-family:system-ui;padding:6px 12px;border-radius:999px;cursor:pointer;user-select:none;'
          document.body.appendChild(sw)
          sw.onclick=()=>{ character = character==='huohuo'?'catgirl':'huohuo'; localStorage.setItem('pixelChar',character); setState('celebrate'); renderCharSwitch() }
        }
        sw.textContent = character==='huohuo' ? '🔮 HuoHuo' : '🐾 Catgirl'
        sw.style.display='block'
      }

      // ═══ 🕹️ Pixel Room: a whole pixelated room, entered via the WALLPAPER picker ═══
      // Live2D disappears entirely; only the pixel room + pixel character remain.
      window._pixelRoomActive = false
      function buildPixelRoom(){
        let room = document.getElementById('pixel-room')
        if (room) return room
        room = document.createElement('div'); room.id = 'pixel-room'
        room.style.cssText = 'position:fixed;inset:0;z-index:1;background:#2b2a4a;overflow:hidden;image-rendering:pixelated;'
        room.innerHTML = `
          <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,#2b2a4a,#2b2a4a 38px,#332f56 38px,#332f56 40px);"></div>
          <div style="position:absolute;top:10%;left:8%;width:18%;height:22%;background:#8fd0e8;box-shadow:0 0 0 6px #1c1a33, inset 0 0 0 3px #cdeff7;"></div>
          <div style="position:absolute;left:0;right:0;bottom:0;height:26%;background:#6b4636;box-shadow:0 4px 0 #4a2f24 inset;"></div>
          <div style="position:absolute;bottom:8%;left:20%;width:60%;height:8%;background:#3d5a7c;border-radius:6px;opacity:.55;"></div>
          <div id="pr-tv" style="position:absolute;bottom:24%;left:66%;width:15%;height:16%;background:#1c1a2e;box-shadow:0 0 0 4px #0e0d1a;cursor:pointer;">
            <div style="position:absolute;inset:10%;background:#4de1c1;opacity:.85;"></div>
          </div>
          <div id="pr-console" style="position:absolute;bottom:24%;left:16%;width:13%;height:9%;background:#3a3358;box-shadow:0 0 0 4px #201c38;cursor:pointer;">
            <div style="position:absolute;top:22%;left:15%;width:18%;height:18%;background:#e06b6b;"></div>
            <div style="position:absolute;top:22%;left:45%;width:18%;height:18%;background:#e6c96b;"></div>
          </div>
          <div id="pr-board" style="position:absolute;bottom:24%;left:44%;width:11%;height:5%;background:#e69a6b;box-shadow:0 0 0 3px #a8623f;cursor:pointer;border-radius:3px;"></div>
        `
        document.body.appendChild(room)
        document.getElementById('pr-tv').onclick = () => goToSpot(0.72, '📺 watching TV~', 'sit')
        document.getElementById('pr-console').onclick = () => goToSpot(0.22, '🎮 playing games~', 'sit')
        document.getElementById('pr-board').onclick = () => goToSpot(0.5, '🛹 let\'s skate!', 'walk')
        return room
      }
      function goToSpot(xFrac, label, poseAfter){
        try {
          posX = Math.max(10, Math.min(window.innerWidth - 140, window.innerWidth * xFrac - 65))
          petCanvas.style.left = posX + 'px'
          setState('walk')
          setTimeout(() => { setState(poseAfter || 'sit'); showBubble(label, 3000) }, 750)
        } catch(e) { console.error('goToSpot:', e) }
      }
      function enterPixelRoom(){
        console.log('🕹️ [6] enterPixelRoom() running, already active:', window._pixelRoomActive)
        if (window._pixelRoomActive) return
        if (window._layerSandwichActive) exitLayerSandwichRoom()
        window._pixelRoomActive = true
        const cv = document.getElementById('canvas'); if (cv) { cv.style.opacity = '0'; cv.style.pointerEvents = 'none' }
        buildPixelRoom()
        if (!pixelMode) enterPixel()
        petCanvas.style.zIndex = '5'
        showBubble('welcome to my room~ 🕹️', 2600)
      }
      function exitPixelRoom(){
        if (!window._pixelRoomActive) return
        window._pixelRoomActive = false
        const room = document.getElementById('pixel-room'); if (room) room.remove()
        if (pixelMode) exitPixel()
        const cv = document.getElementById('canvas'); if (cv) { cv.style.opacity = '1'; cv.style.pointerEvents = '' }
      }

      // ═══ 🛋️ Layer Sandwich Room: her real room photo + foreground occlusion ═══
      // Pixel-pose version: Live2D hides, a pixel sprite of her swaps pose per anchor.
      // Window resizes to small landscape on enter, restores on exit.
      window._layerSandwichActive = false
      let _lsPrevBounds = null

      const LS_ANCHORS = {
        rug:   { leftPct: 50, bottomPct: 8,  heightPct: 34, pose: 'idle_stand',     behind: null },
        couch: { leftPct: 26, bottomPct: 14, heightPct: 26, pose: 'idle_sit_couch', behind: 'couch' },
        desk:  { leftPct: 66, bottomPct: 26, heightPct: 24, pose: 'idle_sit_desk',  behind: 'desk' },
        cat:   { leftPct: 74, bottomPct: 6,  heightPct: 26, pose: 'cat_play_sit',   behind: null },
      }
      // ^ TUNE by eye — leftPct/bottomPct/heightPct are % of the room window.

      // ── Skateboarding: she rides back and forth across the floor, always available ──
      const LS_SKATE_FRAMES = ['skate_1','skate_2','skate_3']
      let _lsSkateTimer = null, _lsSkateFrame = 0, _lsSkateX = -14, _lsSkateDir = 1

      function lsStartSkate(){
        lsStopSkate()
        const ch = document.getElementById('ls-char'); if(!ch) return
        window._lsCurrentAnchor = 'skate'
        ch.style.transition = 'none'
        ch.style.bottom = '5%'
        ch.style.height = '26%'
        ch.style.zIndex = '30'
        _lsSkateX = -14; _lsSkateDir = 1
        _lsSkateTimer = setInterval(() => {
          _lsSkateX += _lsSkateDir * 0.8
          if (_lsSkateX > 108) { _lsSkateDir = -1 }
          if (_lsSkateX < -14) { _lsSkateDir = 1 }
          _lsSkateFrame = (_lsSkateFrame + 1) % LS_SKATE_FRAMES.length
          ch.src = `./assets/room/${LS_SKATE_FRAMES[Math.floor(_lsSkateFrame)]}.png`
          ch.style.left = _lsSkateX + '%'
          ch.style.transform = `translateX(-50%) scaleX(${_lsSkateDir})`
        }, 140)
        showBubble('🛹 wheee~!', 2000)
      }
      function lsStopSkate(){
        if (_lsSkateTimer) { clearInterval(_lsSkateTimer); _lsSkateTimer = null }
        const ch = document.getElementById('ls-char')
        if (ch) { ch.style.transition = 'left 1s cubic-bezier(.4,0,.2,1), bottom 1s cubic-bezier(.4,0,.2,1), height 1s ease'; ch.style.transform = 'translateX(-50%)' }
      }

      // ── Cat play: alternates between the two cat poses at her spot ──
      let _lsCatTimer = null
      function lsStartCatPlay(){
        lsStopCatPlay()
        lsGoToAnchor('cat')
        const poses = ['cat_play_sit','cat_play_lie']
        let i = 0
        _lsCatTimer = setInterval(() => {
          const ch = document.getElementById('ls-char'); if(!ch) return
          i = (i+1) % poses.length
          ch.src = `./assets/room/${poses[i]}.png`
        }, 2600)
        showBubble('🐈 hehe, gotcha~', 2200)
      }
      function lsStopCatPlay(){ if (_lsCatTimer) { clearInterval(_lsCatTimer); _lsCatTimer = null } }

      function lsStopAllActivities(){ lsStopSkate(); lsStopCatPlay() }

      function lsGoToAnchor(name){
        const cfg = LS_ANCHORS[name]; if(!cfg) return
        lsStopSkate()
        if (name !== 'cat') lsStopCatPlay()
        const ch = document.getElementById('ls-char'); if(!ch) return
        ch.style.left = cfg.leftPct + '%'
        ch.style.bottom = cfg.bottomPct + '%'
        ch.style.height = cfg.heightPct + '%'
        ch.style.zIndex = cfg.behind ? '3' : '30'   // behind cutout (55) or in front of everything
        ch.src = `./assets/room/${cfg.pose}.png`
        window._lsCurrentAnchor = name
        if (cfg.behind) showBubble(cfg.behind === 'couch' ? '🛋️ comfy~' : '💻 back to work~', 2200)
      }

      function buildLayerSandwichRoom(){
        let room = document.getElementById('ls-room')
        if (room) return room
        room = document.createElement('div'); room.id = 'ls-room'
        room.style.cssText = 'position:fixed;inset:0;z-index:1;overflow:hidden;image-rendering:pixelated;'
        room.innerHTML = `
          <img src="./assets/room/room-bg.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;">
          <img id="ls-char" src="./assets/room/idle_stand.png"
               style="position:absolute;left:50%;bottom:8%;height:34%;transform:translateX(-50%);z-index:30;image-rendering:pixelated;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45));transition:left 1s cubic-bezier(.4,0,.2,1), bottom 1s cubic-bezier(.4,0,.2,1), height 1s ease;cursor:pointer;pointer-events:auto;">
          <img id="ls-fg-couch" src="./assets/room/sofa-cutout.png"
               style="position:absolute;left:13.9%;top:57.6%;width:32.6%;height:28.1%;object-fit:contain;z-index:55;cursor:pointer;image-rendering:pixelated;">
          <img id="ls-fg-desk" src="./assets/room/desk-cutout.png"
               style="position:absolute;left:50.5%;top:41.5%;width:35.3%;height:35.5%;object-fit:contain;z-index:55;cursor:pointer;image-rendering:pixelated;">
        `
        document.body.appendChild(room)
        document.getElementById('ls-fg-couch').onclick = () => { lsStopAuto(); lsGoToAnchor(window._lsCurrentAnchor === 'couch' ? 'rug' : 'couch') }
        document.getElementById('ls-fg-desk').onclick  = () => { lsStopAuto(); lsGoToAnchor(window._lsCurrentAnchor === 'desk'  ? 'rug' : 'desk') }
        // click her → cycle activities: skate → cat play → back to rug
        document.getElementById('ls-char').onclick = (e) => {
          e.stopPropagation(); lsStopAuto()
          const cur = window._lsCurrentAnchor
          if (cur === 'skate') lsStartCatPlay()
          else if (cur === 'cat') lsGoToAnchor('rug')
          else lsStartSkate()
        }
        return room
      }

      // ── Auto mode: she lives her own life — wanders activities every 25-60s ──
      // Weighted by portfolio mood (green day → playful, red day → focused at desk)
      // and time of day (night → couch sleepy, morning → coffee energy).
      let _lsAutoTimer = null
      let _lsMood = 'flat'   // 'green' | 'red' | 'flat'
      async function lsRefreshMood(){
        try {
          const s = await ipcRenderer.invoke('get-paper-stats').catch(()=>null)
          const pnl = s?.todayPnl ?? s?.dayPnl ?? s?.totalPnl ?? 0
          const prev = _lsMood
          _lsMood = pnl > 5 ? 'green' : pnl < -5 ? 'red' : 'flat'
          if (_lsMood !== prev && window._layerSandwichActive) {
            if (_lsMood === 'green') { setEffect && setEffect('none'); showBubble('portfolio\'s green today~ 💚', 2600) }
            if (_lsMood === 'red') { setEffect && setEffect('rain'); showBubble('rough day out there… staying focused 🌧️', 2800) }
          }
        } catch(e) {}
      }
      function lsPickActivity(){
        const hour = new Date().getHours()
        let pool
        if (hour >= 23 || hour < 7) pool = ['couch','couch','couch','rug']            // night: sleepy couch
        else if (_lsMood === 'green') pool = ['skate','skate','cat','rug','couch']     // green: playful
        else if (_lsMood === 'red') pool = ['desk','desk','desk','couch','rug']        // red: at work
        else pool = ['rug','couch','desk','skate','cat']
        const options = pool.filter(a => a !== window._lsCurrentAnchor)
        return options[Math.floor(Math.random()*options.length)] || 'rug'
      }
      function lsStartAuto(){
        lsStopAuto()
        lsRefreshMood()
        const moodTimer = setInterval(() => { if (window._layerSandwichActive) lsRefreshMood(); else clearInterval(moodTimer) }, 5*60*1000)
        const tick = () => {
          if (!window._layerSandwichActive) return
          const next = lsPickActivity()
          if (next === 'skate') lsStartSkate()
          else if (next === 'cat') lsStartCatPlay()
          else {
            lsGoToAnchor(next)
            const hour = new Date().getHours()
            if ((hour >= 23 || hour < 7) && next === 'couch') showBubble('getting sleepy… 😴', 2400)
            else if (hour >= 7 && hour < 10 && Math.random() < 0.4) showBubble('☕ morning energy~', 2200)
          }
          _lsAutoTimer = setTimeout(tick, 15000 + Math.random()*25000)
        }
        _lsAutoTimer = setTimeout(tick, 6000)
      }
      function lsStopAuto(){ if (_lsAutoTimer) { clearTimeout(_lsAutoTimer); _lsAutoTimer = null } }

      function enterLayerSandwichRoom(){
        if (window._layerSandwichActive) return
        if (window._pixelRoomActive) exitPixelRoom()   // kills pixel sprite, restores window + Live2D
        // ── self-check: report any missing room assets in console + on screen ──
        try {
          const fs2 = require('fs'), path2 = require('path')
          const need = ['room-bg.png','sofa-cutout.png','desk-cutout.png','idle_stand.png','idle_sit_couch.png','idle_sit_desk.png','skate_1.png','skate_2.png','skate_3.png','cat_play_sit.png','cat_play_lie.png']
          const missing = need.filter(f => !fs2.existsSync(path2.join(__dirname,'assets','room',f)))
          if (missing.length) {
            console.error('🛋️ MISSING room assets:', missing.join(', '))
            alert('My Room missing files in assets/room/:\n' + missing.join('\n'))
          } else { console.log('🛋️ all room assets found ✓') }
        } catch(e) { console.warn('room asset check failed', e) }
        window._layerSandwichActive = true
        if (pixelMode) exitPixel()   // plain free-roam pixel mode also owns click-through — must exit it
        try { ipcRenderer.send('pixel-mode', false) } catch(e) {}   // belt & braces: force window interactive
        // hide Live2D — pixel sprite takes over
        const cv = document.getElementById('canvas')
        if (cv) { cv.style.opacity = '0'; cv.style.pointerEvents = 'none' }
        // resize to small landscape — delayed so it wins over pixel-mode-off bounds restore
        setTimeout(() => {
          try {
            _lsPrevBounds = { w: window.outerWidth, h: window.outerHeight, x: window.screenX, y: window.screenY }
            window.resizeTo(900, 620)
          } catch(e) { console.warn('ls resize failed', e) }
        }, 180)
        buildLayerSandwichRoom()
        lsGoToAnchor('rug')
        lsStartAuto()
        showBubble('this is my room~ 🌿', 2400)
      }

      function exitLayerSandwichRoom(){
        if (!window._layerSandwichActive) return
        window._layerSandwichActive = false
        lsStopAuto(); lsStopAllActivities()
        const room = document.getElementById('ls-room'); if (room) room.remove()
        const cv = document.getElementById('canvas')
        if (cv) { cv.style.opacity = '1'; cv.style.pointerEvents = '' }
        try {
          if (_lsPrevBounds) { window.resizeTo(_lsPrevBounds.w, _lsPrevBounds.h); window.moveTo(_lsPrevBounds.x, _lsPrevBounds.y); _lsPrevBounds = null }
        } catch(e) {}
      }

      let _lastToggle = 0
      const toggle = (e)=>{
        if(window._layerSandwichActive || window._pixelRoomActive) return   // rooms own the stage — no pixel-pet toggle
        if(noDragIds.includes(e.target?.id)||e.target?.closest?.('#chat-panel')||e.target?.closest?.('#ask-bar'))return
        const now = Date.now(); if(now - _lastToggle < 400) return; _lastToggle = now
        pixelMode?exitPixel():enterPixel()
      }
      document.addEventListener('dblclick', toggle)
      petCanvas.addEventListener('dblclick',(e)=>{ e.stopPropagation(); exitPixel() })
      // Tap the pet → cycle through fun actions (exercise, dance, celebrate…)
      const TAP_ACTIONS = ['exercise','dance','celebrate','happy','think','sleep']
      let _tapIdx = 0
      petCanvas.addEventListener('click',()=>{
        if(_petDragged)return
        const act = TAP_ACTIONS[_tapIdx % TAP_ACTIONS.length]; _tapIdx++
        setState(act)
        showBubble({exercise:'💪 workout!',dance:'♪ dancing~',celebrate:'🎉 yay!',happy:'hehe 🌸',think:'hmm… 🤔',sleep:'sleepy… 💤'}[act]||'🌸',2000)
      })

      // ── Click-through: only capture the mouse when it's actually over the pet ──
      // (so the fullscreen overlay lets you use everything else normally)
      let _wasOver = false
      function petRect(){ return { l:posX, t:posY, r:posX+130, b:posY+130 } }
      document.addEventListener('mousemove',(e)=>{
        if(!pixelMode) return  // box mode is a normal interactive window; only pixel mode needs hit-tracking
        const R=petRect()
        const over = e.clientX>=R.l && e.clientX<=R.r && e.clientY>=R.t && e.clientY<=R.b
        const sw=document.getElementById('pixel-switch')
        const overSwitch = sw && sw.style.display!=='none' && (()=>{const b=sw.getBoundingClientRect();return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom})()
        const bar = document.getElementById('ask-bar')
        const overBar = bar && (()=>{const b=bar.getBoundingClientRect();return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom})()
        const active = over || overSwitch || overBar || _petDragging
        if(active!==_wasOver){ _wasOver=active; try{ipcRenderer.send('pixel-hit',active)}catch(err){} }
      })

      // ── Pick her up like a kitten: she follows the cursor within the overlay, wobbles, grumbles ──
      const GRUMPY = ['put me down! 😣','hey! 😾','let go~','nooo 💢','eep!','leave me alone!','hmph! 😤']
      let _wobble = 0
      petCanvas.addEventListener('mousedown',(e)=>{
        if(!pixelMode) return
        _petDragging=true; _petDragged=false
        showBubble(GRUMPY[Math.floor(Math.random()*GRUMPY.length)], 1800)
        e.preventDefault(); e.stopPropagation()
      })
      document.addEventListener('mousemove',(e)=>{
        if(!_petDragging) return
        _petDragged=true
        // she dangles from the cursor (held by the scruff) — center her on the pointer, slightly below
        posX = e.clientX - 65
        posY = e.clientY - 40
        posX = Math.max(0, Math.min(window.innerWidth-130, posX))
        posY = Math.max(0, Math.min(window.innerHeight-130, posY))
        petCanvas.style.left=posX+'px'; petCanvas.style.top=posY+'px'
        // occasional grumble while held
        if(Math.random()<0.02) showBubble(GRUMPY[Math.floor(Math.random()*GRUMPY.length)], 1500)
      })
      document.addEventListener('mouseup',()=>{
        if(!_petDragging) return
        _petDragging=false
        // drop & land: fall to the floor, then resume roaming
        const floorY = window.innerHeight - 150
        let dropTimer = setInterval(()=>{
          posY += 18
          if(posY >= floorY){ posY = floorY; clearInterval(dropTimer); setState('idle'); showBubble('hmph! 😤', 1500) }
          petCanvas.style.top = posY + 'px'
        }, 30)
        setTimeout(()=>_petDragged=false, 50)
      })

      ipcRenderer.on('asuka-react',(e,data)=>{
        if(!pixelMode)return
        const ev=data?.event||data
        if(ev==='trade_win'){setState('celebrate');showBubble('we won! 🎉',3000)}
        else if(ev==='trade_loss'){setState('sad');showBubble('aw… next one 💪',3000)}
        else if(ev==='trade_open'){showBubble('trade opened 👀',2500)}
        else if(ev==='swarm_thinking'){setState('think');showBubble('scanning… 🔍',2500)}
      })

      // ── React to user activity: idle long → she sleeps; you come back → she perks up ──
      let _lastActivity = Date.now(), _wasIdle = false
      function noteActivity(){ _lastActivity = Date.now() }
      window.addEventListener('mousemove', noteActivity)
      window.addEventListener('keydown', noteActivity)
      setInterval(()=>{
        if(!pixelMode) return
        const idleMs = Date.now() - _lastActivity
        if(idleMs > 60000 && !_wasIdle){           // 1 min idle → she gets sleepy
          _wasIdle = true; setState('sleep'); showBubble('zzz… 💤', 3000)
        } else if(idleMs < 3000 && _wasIdle){       // you're back → she perks up
          _wasIdle = false; setState('celebrate'); showBubble('you\'re back! 🌸', 2500)
        }
      }, 4000)

      window._pixelSay=(txt)=>showBubble(txt,3000)

      // ── Scoping fix: setScene() lives outside initPixelPet(), so these
      // room-entry functions must be exposed on window to be callable from it.
      window.enterPixelRoom = enterPixelRoom
      window.exitPixelRoom = exitPixelRoom
      window.enterLayerSandwichRoom = enterLayerSandwichRoom
      window.exitLayerSandwichRoom = exitLayerSandwichRoom
    }
    // run after DOM is ready so the pixel-pet canvas element exists
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPixelPet)
    else initPixelPet()

  </script>

  <!-- ── Study whiteboard note (shows what Asuka is teaching, like the images) ── -->
  <div id="wb-note" style="display:none;position:fixed;top:14px;left:14px;right:14px;background:rgba(16,16,19,.96);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;z-index:9997;box-shadow:0 8px 30px rgba(0,0,0,.4);">
    <div id="wb-note-title" style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#5e9eff;opacity:.9;margin-bottom:5px;font-family:monospace;">Whiteboard</div>
    <div id="wb-note-body" style="font-size:12px;line-height:1.5;color:#eafff5;font-family:monospace;white-space:pre-wrap;max-height:120px;overflow-y:auto;"></div>
    <div id="wb-note-close" style="position:absolute;top:8px;right:10px;cursor:pointer;color:#889;font-size:14px;">×</div>
  </div>

  <!-- ── Pixel Pet (idle alter-ego, double-tap to toggle) ── -->
  <canvas id="pixel-pet" width="128" height="128" style="display:none;position:fixed;bottom:20px;left:20px;width:140px;height:140px;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;z-index:9999;"></canvas>
  <div id="pixel-bubble" style="display:none;position:fixed;bottom:150px;left:20px;background:rgba(20,18,30,0.92);color:#fff;font-size:11px;font-family:system-ui,sans-serif;padding:6px 10px;border-radius:10px;z-index:10000;white-space:nowrap;pointer-events:none;"></div>


<!-- ══ Quick wallpaper switcher (beside her) ══ -->
<div id="wp-btn" title="Wallpapers" style="position:fixed;bottom:180px;left:10px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:9001;backdrop-filter:blur(10px);">🖼️</div>
<div id="wp-pop" style="display:none;position:fixed;bottom:180px;left:56px;width:210px;max-height:280px;overflow-y:auto;background:rgba(20,20,23,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px;z-index:9001;box-shadow:0 10px 40px rgba(0,0,0,.5);">
  <div style="font-size:11px;font-weight:700;color:#a0a0a8;margin:2px 4px 8px;">Wallpapers</div>
  <div id="wp-pop-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"></div>
  <div id="wp-pop-none" style="margin-top:6px;text-align:center;font-size:11px;color:#a0a0a8;cursor:pointer;padding:6px;border:1px solid rgba(255,255,255,.1);border-radius:8px;">✕ None</div>
</div>

<!-- ══ Ask bar: type anything, attach anything ══ -->
<!-- ── » Side drawer: recent chat + docs beside her ── -->
<div id="sd-toggle" title="Recent chat & docs" style="position:fixed;right:0;top:42%;z-index:9500;width:26px;height:56px;border-radius:10px 0 0 10px;background:rgba(15,18,26,0.92);border:1px solid rgba(255,255,255,0.14);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#cbd5e1;font-size:15px;font-weight:800;user-select:none;">«</div>
<div id="side-drawer" style="position:fixed;top:8%;bottom:14%;right:-300px;width:280px;z-index:9400;background:rgba(12,15,22,0.97);border:1px solid rgba(255,255,255,0.12);border-right:none;border-radius:14px 0 0 14px;box-shadow:-10px 0 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1);font-family:system-ui;overflow:hidden;">
  <div style="display:flex;border-bottom:1px solid rgba(255,255,255,0.09);flex-shrink:0;">
    <div class="sd-tab active" data-tab="chat" style="flex:1;text-align:center;padding:10px;font-size:11px;font-weight:700;color:#e2e8f0;cursor:pointer;border-bottom:2px solid #2dd4ff;">💬 Chat</div>
    <div class="sd-tab" data-tab="docs" style="flex:1;text-align:center;padding:10px;font-size:11px;font-weight:700;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">📂 Docs</div>
  </div>
  <div id="sd-chat" style="flex:1;overflow-y:auto;padding:10px;font-size:11.5px;line-height:1.5;"></div>
  <div id="sd-docs" style="flex:1;overflow-y:auto;padding:10px;display:none;"></div>
</div>

<div id="ask-bar" style="position:fixed;left:10px;right:10px;bottom:12px;z-index:9000;display:flex;flex-direction:column;gap:6px;">
  <div id="ab-chip" style="display:none;align-self:flex-start;background:rgba(10,132,255,.18);border:1px solid rgba(10,132,255,.4);border-radius:10px;padding:5px 10px;font-size:11px;color:#cfe6ff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
    <span id="ab-chip-name"></span> <span id="ab-chip-x" style="cursor:pointer;margin-left:6px;opacity:.8;">✕</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;background:rgba(20,20,23,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:7px 8px 7px 12px;box-shadow:0 8px 30px rgba(0,0,0,.4);">
    <label for="ab-file" style="cursor:pointer;font-size:15px;opacity:.75;flex-shrink:0;" title="Attach a file">📎</label>
    <input id="ab-file" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.csv,.xlsx,.xls,.json,.log" style="display:none;">
    <input id="ab-in" placeholder="Ask Asuka anything…" style="flex:1;background:transparent;border:none;outline:none;color:#f5f5f7;font-size:13px;font-family:inherit;min-width:0;">
    <button id="ab-send" style="flex-shrink:0;width:30px;height:30px;border:none;border-radius:10px;background:#0a84ff;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;">➤</button>
  </div>
</div>
<script>
console.log('%c[ASK-BAR SCRIPT REACHED]', 'color:lime;font-size:16px')
window.__askBarLoaded = true
;(function(){
  // ── » side drawer logic ──
  try {
    const sdToggle = document.getElementById('sd-toggle')
    const sdDrawer = document.getElementById('side-drawer')
    let sdOpen = false
    function sdRenderChat(){
      let hist = []
      try { hist = JSON.parse(localStorage.getItem('asukaHistory') || '[]') } catch(e) {}
      const box = document.getElementById('sd-chat')
      box.innerHTML = hist.slice(-40).map(m =>
        `<div style="margin-bottom:9px;"><div style="font-size:9px;color:${m.role==='user'?'#2dd4ff':'#f3a8d0'};font-weight:700;letter-spacing:.5px;">${m.role==='user'?'YOU':'ASUKA'} · ${m.time||''}</div><div style="color:#d7dae0;">${String(m.text).replace(/</g,'&lt;')}</div></div>`
      ).join('') || '<div style="color:#64748b;font-size:11px;">No messages yet~</div>'
      box.scrollTop = box.scrollHeight
    }
    async function sdRenderDocs(){
      const box = document.getElementById('sd-docs')
      const works = await ipcRenderer.invoke('list-works').catch(()=>[]) || []
      const icons = { doc:'📄', text:'✍️', sheet:'📊', gdoc:'📝' }
      box.innerHTML = works.length ? works.map((w,i) =>
        `<div class="sd-doc" data-i="${i}" style="padding:9px 10px;margin-bottom:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;cursor:${w.path?'pointer':'default'};">
          <div style="font-size:11.5px;font-weight:600;color:#e2e8f0;">${icons[w.kind]||'📄'} ${String(w.title||'Untitled').replace(/</g,'&lt;')}</div>
          <div style="font-size:9px;color:#64748b;margin-top:2px;">${w.at ? new Date(w.at).toLocaleString() : ''}${w.path ? ' · tap to open' : ''}</div>
        </div>`).join('') : '<div style="color:#64748b;font-size:11px;">Nothing made yet — ask her to write or build something~</div>'
      box.querySelectorAll('.sd-doc').forEach(el => el.onclick = () => {
        const w = works[+el.dataset.i]
        if (w?.path) ipcRenderer.invoke('open-file-path', w.path).catch(()=>{})
      })
    }
    sdToggle.addEventListener('click', () => {
      sdOpen = !sdOpen
      sdDrawer.style.right = sdOpen ? '0px' : '-300px'
      sdToggle.textContent = sdOpen ? '»' : '«'
      sdToggle.style.right = sdOpen ? '280px' : '0'
      if (sdOpen) { sdRenderChat(); sdRenderDocs() }
    })
    document.querySelectorAll('.sd-tab').forEach(t => t.onclick = () => {
      document.querySelectorAll('.sd-tab').forEach(x => { x.classList.remove('active'); x.style.color='#64748b'; x.style.borderBottomColor='transparent' })
      t.classList.add('active'); t.style.color='#e2e8f0'; t.style.borderBottomColor='#2dd4ff'
      document.getElementById('sd-chat').style.display = t.dataset.tab==='chat' ? 'block' : 'none'
      document.getElementById('sd-docs').style.display = t.dataset.tab==='docs' ? 'block' : 'none'
    })
  } catch(err) { console.error('side drawer init:', err) }
})()
;(function(){
  function initAskBar(){
  const { ipcRenderer } = require('electron')
  const inp = document.getElementById('ab-in'), send = document.getElementById('ab-send')
  const fileIn = document.getElementById('ab-file'), chip = document.getElementById('ab-chip')
  if (!inp || !send) { console.error('ask-bar: elements missing'); return }
  console.log('ask-bar: initialized OK')
  let attached = null   // { name, b64, media }

  function setChip(f) {
    attached = f
    chip.style.display = f ? 'inline-block' : 'none'
    if (f) document.getElementById('ab-chip-name').textContent = '📎 ' + f.name
  }
  document.getElementById('ab-chip-x').onclick = () => { setChip(null); fileIn.value = '' }

  function readFile(f) {
    return new Promise((res, rej) => {
      const r = new FileReader()
      r.onload = () => res({ name: f.name, b64: String(r.result).split(',')[1], media: f.type || '' })
      r.onerror = rej
      r.readAsDataURL(f)
    })
  }
  fileIn.addEventListener('change', async () => {
    if (!fileIn.files[0]) return
    if (fileIn.files[0].size > 25*1024*1024) { setChip(null); alert('That file is over 25MB — too big for the ask bar.'); return }
    setChip(await readFile(fileIn.files[0]))
  })
  // paste an image straight into the bar (chart screenshots!)
  inp.addEventListener('paste', async (e) => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'))
    if (item) { e.preventDefault(); const f = item.getAsFile(); if (f) setChip(await readFile(new File([f], 'pasted-image.png', { type: f.type }))) }
  })

  async function go() {
    try {
      const text = inp.value.trim()
      if (!text && !attached) return
      inp.value = ''
      if (attached) {
        const f = attached; setChip(null); fileIn.value = ''
        try { window.addToHistory && addToHistory('user', (text || 'What is this?') + ' [' + f.name + ']') } catch(e){}
        try { window.setStatus && setStatus('Looking at ' + f.name + '…') } catch(e){}
        const r = await ipcRenderer.invoke('analyze-upload', { name: f.name, b64: f.b64, media: f.media, prompt: text }).catch(()=>null)
        const ans = r?.answer ? r.answer
          : r?.error === 'scanned_pdf' ? 'That PDF is scanned images — take it to the Study room and I\'ll OCR it there!'
          : r?.error === 'unsupported' ? 'I can\'t read that file type yet — images, PDFs, spreadsheets, and text files work.'
          : 'Hmm, I couldn\'t read that one.'
        try { window.addToHistory && addToHistory('asuka', ans) } catch(e){}
        try { if (typeof isHerMuted !== 'undefined' && !isHerMuted && typeof speakText === 'function' && ans.length < 600) await speakText(ans) } catch(e){}
        try { window.setStatus && setStatus('Listening...') } catch(e){}
      } else {
        if (typeof sendTypedMessage === 'function') await sendTypedMessage(text)
        else { try { addToHistory && addToHistory('asuka', '(chat not ready — reloading)') } catch(e){}; }
      }
    } catch(err) { console.error('ask-bar go() error:', err); try { addToHistory && addToHistory('asuka', 'oops, something glitched — try again?') } catch(e){} }
  }
  send.onclick = go
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go() } })
  // extra safety: focus the input when the bar is clicked anywhere
  document.getElementById('ask-bar')?.addEventListener('mousedown', (e) => { if (e.target.id !== 'ab-send' && e.target.id !== 'ab-file') inp.focus() })
  }
  try {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAskBar)
    else initAskBar()
  } catch(err) { console.error('ask-bar init failed:', err) }

  // ── Quick wallpaper switcher beside her ──
  function initWpSwitcher(){
    const { ipcRenderer } = require('electron')
    const btn = document.getElementById('wp-btn'), pop = document.getElementById('wp-pop'), grid = document.getElementById('wp-pop-grid')
    if (!btn || !pop || !grid) return
    async function loadThumbs(){
      const r = await ipcRenderer.invoke('list-scenes').catch(()=>({scenes:[]}))
      const scenes = r?.scenes || []
      const pixelTile = `<div class="wpp" id="wpp-pixelroom" style="cursor:pointer;border:1px solid rgba(77,225,193,.35);border-radius:9px;padding:3px;text-align:center;background:rgba(77,225,193,.08);"><div style="width:100%;height:46px;border-radius:7px;background:linear-gradient(135deg,#2b2a4a,#3a3358);display:flex;align-items:center;justify-content:center;font-size:20px;">🕹️</div><div style="font-size:9px;color:#4de1c1;margin-top:2px;">Pixel Room</div></div>`
      const lsTile = `<div class="wpp" id="wpp-layersandwich" style="cursor:pointer;border:1px solid rgba(167,139,250,.35);border-radius:9px;padding:3px;text-align:center;background:rgba(167,139,250,.08);"><div style="width:100%;height:46px;border-radius:7px;background:linear-gradient(135deg,#2a2f22,#3d4a2e);display:flex;align-items:center;justify-content:center;font-size:20px;">🛋️</div><div style="font-size:9px;color:#a78bfa;margin-top:2px;">My Room</div></div>`
      grid.innerHTML = pixelTile + lsTile + (scenes.length ? scenes.map(s => {
        const src = 'file://' + s.path.replace(/'/g, "\\'")
        const thumb = s.video
          ? `<video src="${src}" muted style="width:100%;height:46px;object-fit:cover;border-radius:7px;"></video>`
          : `<div style="width:100%;height:46px;border-radius:7px;background:url('${src}') center/cover;"></div>`
        return `<div class="wpp" data-name="${s.name}" style="cursor:pointer;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:3px;text-align:center;">${thumb}<div style="font-size:9px;color:#a0a0a8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.name}${s.video?' 🎬':''}</div></div>`
      }).join('') : '<div style="grid-column:1/-1;color:#6a6a72;font-size:11px;text-align:center;padding:8px;">Drop images/videos into assets/scenes/</div>')
      document.getElementById('wpp-pixelroom').onclick = () => { setScene('__pixelroom__'); pop.style.display='none' }
      document.getElementById('wpp-layersandwich').onclick = () => { setScene('__layersandwich__'); pop.style.display='none' }
      grid.querySelectorAll('.wpp:not(#wpp-pixelroom):not(#wpp-layersandwich)').forEach(el => el.onclick = () => { try { setScene(el.dataset.name) } catch(e){}
        grid.querySelectorAll('.wpp').forEach(x=>x.style.borderColor='rgba(255,255,255,.1)'); el.style.borderColor='#0a84ff' })
    }
    btn.addEventListener('click', () => {
      const open = pop.style.display !== 'none'
      pop.style.display = open ? 'none' : 'block'
      if (!open) loadThumbs()
    })
    document.getElementById('wp-pop-none').addEventListener('click', () => { try { setScene(null) } catch(e){} })
  }
  try { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWpSwitcher); else initWpSwitcher() } catch(e){ console.error('wp switcher:', e) }
})()
</script>
</body>
</html>
