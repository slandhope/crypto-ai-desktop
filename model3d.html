<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0c;}
  #c3d{display:block;width:100vw;height:100vh;}
  #msg{position:fixed;top:0;left:0;right:0;padding:12px;font:13px -apple-system,sans-serif;color:#fff;background:rgba(0,0,0,.8);z-index:100;white-space:pre-wrap;line-height:1.5;}
  #drag{position:fixed;top:0;left:0;right:0;height:30px;-webkit-app-region:drag;z-index:5;}
  #anim-bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:100;max-width:90vw;}
  .anim-btn{padding:7px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(20,20,23,.9);color:#f5f5f7;font:12px -apple-system;cursor:pointer;}
  .anim-btn:hover{background:rgba(10,132,255,.3);}
</style></head>
<body>
<div id="drag"></div><div id="msg">Starting...</div><canvas id="c3d"></canvas><div id="anim-bar"></div>
<script>
(function () {
  const path = require('path');
  const fs = require('fs');
  const appDir = __dirname;
  const msg = document.getElementById('msg');
  const say = (t) => { msg.textContent = t; };

  try {
    const vrmDir = path.join(appDir, 'assets', 'vrm');
    const all = fs.existsSync(vrmDir) ? fs.readdirSync(vrmDir) : [];
    const modelFiles = all.filter((f) => /\.(glb|gltf|vrm)$/i.test(f));
    if (!modelFiles.length) { say('No .glb model in assets/vrm/'); return; }

    const modelFile = modelFiles.find((f) => /^nova/i.test(f))
      || modelFiles.find((f) => /^asuka/i.test(f))
      || modelFiles[0];

    const animPriority = (name) => {
      const n = name.toLowerCase();
      if (n.includes('idle')) return 0;
      if (n.includes('sitting')) return 1;
      if (n.includes('talk')) return 2;
      if (n.includes('walk') || n.includes('strafe')) return 3;
      return 4;
    };

    const animFiles = all
      .filter((f) => /\.fbx$/i.test(f) && !/^\d+\.fbx$/i.test(f))
      .sort((a, b) => animPriority(a) - animPriority(b) || a.localeCompare(b));

    const threePath = path.join(appDir, 'node_modules', 'three', 'build', 'three.module.js');
    if (!fs.existsSync(threePath)) { say('Run: npm install three'); return; }

    const toURL = (p) => 'file://' + p.replace(/\\/g, '/');
    window.__modelURL = toURL(path.join(vrmDir, modelFile));
    window.__anims = animFiles.map((f) => ({
      url: toURL(path.join(vrmDir, f)),
      name: f.replace(/\.fbx$/i, ''),
    }));

    const im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({
      imports: {
        three: toURL(threePath),
        'three/addons/': toURL(path.join(appDir, 'node_modules', 'three', 'examples', 'jsm')) + '/',
      },
    });
    document.head.appendChild(im);

    const mod = document.createElement('script');
    mod.type = 'module';
    mod.src = toURL(path.join(appDir, 'model3d-viewer.js'));
    document.body.appendChild(mod);
  } catch (e) {
    say('Error: ' + e.message);
  }
})();
</script></body></html>
